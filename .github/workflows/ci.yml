name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
        env:
          KK_PRICEWATCH_API_TOKEN: ci-test-token
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
